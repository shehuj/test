<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
    .card { background: white; padding: 2rem 3rem; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; }
    h1 { margin: 0 0 .5rem; font-size: 2rem; color: #e53e3e; }
    p  { margin: 0; color: #666; }
    a  { color: #3182ce; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404 — Page Not Found</h1>
    <p>The page you're looking for doesn't exist. <a href="/">Go home</a></p>
  </div>
</body>
</html>
