name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        mv Containers/Dockerfile-test Containers/Dockerfile
        docker build ./Containers --file Dockerfile-test --tag my-image-name:$(date +%s)
