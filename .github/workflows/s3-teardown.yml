name: S3 Website — Full Teardown (DESTRUCTIVE)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly 'yes-delete-all' to confirm full teardown of the S3 website infrastructure. THIS IS IRREVERSIBLE."
        required: true
        type: string

env:
  TF_VERSION: "1.9.0"
  TF_WORKING_DIR: s3-prod/terraform
  AWS_REGION: ${{ secrets.AWS_REGION }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # SAFETY GATE — abort immediately if confirmation string is wrong
  # ─────────────────────────────────────────────────────────────────────────────
  safety-gate:
    name: Safety Gate — Validate Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "yes-delete-all" ]; then
            echo "::error::Confirmation does not match required value 'yes-delete-all'."
            echo "::error::Got: '${{ github.event.inputs.confirmation }}'"
            echo "::error::Aborting teardown to prevent accidental destruction."
            exit 1
          fi
          echo "Confirmation accepted. Proceeding to approval gate."

  # ─────────────────────────────────────────────────────────────────────────────
  # APPROVAL GATE — requires manual sign-off via the "production" environment
  # ─────────────────────────────────────────────────────────────────────────────
  approval-gate:
    name: Approval Gate — Await Manual Sign-Off
    runs-on: ubuntu-latest
    needs: safety-gate
    environment: production
    steps:
      - name: Approval received
        run: |
          echo "Manual approval granted by a production environment reviewer."
          echo "Triggered by : ${{ github.actor }}"
          echo "Run ID       : ${{ github.run_id }}"
          echo "Timestamp    : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

  # ─────────────────────────────────────────────────────────────────────────────
  # TERRAFORM DESTROY — drains both S3 buckets, disables CloudFront, then destroys
  # Buckets must be fully emptied first — versioned buckets cannot be deleted by
  # Terraform unless they contain zero objects and zero delete markers.
  # ─────────────────────────────────────────────────────────────────────────────
  terraform-destroy:
    name: Terraform Destroy — S3 Website & All Managed Resources
    runs-on: ubuntu-latest
    needs: approval-gate

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Disable the wrapper so terraform output -raw returns clean values
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -input=false
        env:
          TF_VAR_project: ${{ secrets.S3_PROJECT_NAME }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_environment: ${{ secrets.ENVIRONMENT }}
          TF_VAR_website_prefix: ${{ secrets.S3_WEBSITE_PREFIX }}

      # ── Drain website bucket ─────────────────────────────────────────────────

      - name: Website bucket — suspend versioning
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          BUCKET=$(terraform output -raw website_bucket_name 2>/dev/null || true)
          if [ -z "${BUCKET}" ]; then echo "No website bucket output — skipping."; exit 0; fi
          echo "Suspending versioning on s3://${BUCKET} ..."
          aws s3api put-bucket-versioning \
            --bucket "${BUCKET}" \
            --versioning-configuration Status=Suspended \
            --region "${{ secrets.AWS_REGION }}" || true

      - name: Website bucket — delete all object versions
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          BUCKET=$(terraform output -raw website_bucket_name 2>/dev/null || true)
          [ -z "${BUCKET}" ] && exit 0
          REGION="${{ secrets.AWS_REGION }}"
          while true; do
            VERSIONS=$(aws s3api list-object-versions \
              --bucket "${BUCKET}" --region "${REGION}" \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)
            COUNT=$(echo "${VERSIONS}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))")
            [ "${COUNT}" -eq 0 ] && { echo "No more versions."; break; }
            echo "Deleting batch of ${COUNT} versions ..."
            aws s3api delete-objects \
              --bucket "${BUCKET}" --region "${REGION}" \
              --delete "${VERSIONS}" > /dev/null
          done

      - name: Website bucket — delete all delete markers
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          BUCKET=$(terraform output -raw website_bucket_name 2>/dev/null || true)
          [ -z "${BUCKET}" ] && exit 0
          REGION="${{ secrets.AWS_REGION }}"
          while true; do
            MARKERS=$(aws s3api list-object-versions \
              --bucket "${BUCKET}" --region "${REGION}" \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)
            COUNT=$(echo "${MARKERS}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))")
            [ "${COUNT}" -eq 0 ] && { echo "No more delete markers."; break; }
            echo "Deleting batch of ${COUNT} delete markers ..."
            aws s3api delete-objects \
              --bucket "${BUCKET}" --region "${REGION}" \
              --delete "${MARKERS}" > /dev/null
          done

      # ── Drain access logs bucket ─────────────────────────────────────────────

      - name: Logs bucket — suspend versioning
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          BUCKET=$(terraform output -raw logs_bucket_name 2>/dev/null || true)
          if [ -z "${BUCKET}" ]; then echo "No logs bucket output — skipping."; exit 0; fi
          echo "Suspending versioning on s3://${BUCKET} ..."
          aws s3api put-bucket-versioning \
            --bucket "${BUCKET}" \
            --versioning-configuration Status=Suspended \
            --region "${{ secrets.AWS_REGION }}" || true

      - name: Logs bucket — delete all object versions
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          BUCKET=$(terraform output -raw logs_bucket_name 2>/dev/null || true)
          [ -z "${BUCKET}" ] && exit 0
          REGION="${{ secrets.AWS_REGION }}"
          while true; do
            VERSIONS=$(aws s3api list-object-versions \
              --bucket "${BUCKET}" --region "${REGION}" \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)
            COUNT=$(echo "${VERSIONS}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))")
            [ "${COUNT}" -eq 0 ] && { echo "No more versions."; break; }
            echo "Deleting batch of ${COUNT} versions ..."
            aws s3api delete-objects \
              --bucket "${BUCKET}" --region "${REGION}" \
              --delete "${VERSIONS}" > /dev/null
          done

      - name: Logs bucket — delete all delete markers
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          BUCKET=$(terraform output -raw logs_bucket_name 2>/dev/null || true)
          [ -z "${BUCKET}" ] && exit 0
          REGION="${{ secrets.AWS_REGION }}"
          while true; do
            MARKERS=$(aws s3api list-object-versions \
              --bucket "${BUCKET}" --region "${REGION}" \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)
            COUNT=$(echo "${MARKERS}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))")
            [ "${COUNT}" -eq 0 ] && { echo "No more delete markers."; break; }
            echo "Deleting batch of ${COUNT} delete markers ..."
            aws s3api delete-objects \
              --bucket "${BUCKET}" --region "${REGION}" \
              --delete "${MARKERS}" > /dev/null
          done

      # ── Disable CloudFront before destroy ────────────────────────────────────
      # Terraform destroy will fail if the distribution is still Enabled.

      - name: CloudFront — disable distribution
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || true)
          if [ -z "${DIST_ID}" ]; then echo "No CloudFront distribution output — skipping."; exit 0; fi

          echo "Disabling CloudFront distribution ${DIST_ID} ..."

          aws cloudfront get-distribution-config --id "${DIST_ID}" > /tmp/cf_full.json

          ETAG=$(python3 -c "import json; print(json.load(open('/tmp/cf_full.json'))['ETag'])")

          python3 -c "import json; d=json.load(open('/tmp/cf_full.json')); d['DistributionConfig']['Enabled']=False; open('/tmp/cf_config.json','w').write(json.dumps(d['DistributionConfig']))"

          aws cloudfront update-distribution \
            --id "${DIST_ID}" \
            --if-match "${ETAG}" \
            --distribution-config file:///tmp/cf_config.json > /dev/null

          echo "Waiting for distribution to deploy in disabled state (may take several minutes) ..."
          aws cloudfront wait distribution-deployed --id "${DIST_ID}"
          echo "Distribution ${DIST_ID} is now disabled."

      # ── Terraform destroy ────────────────────────────────────────────────────

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve -input=false
        env:
          TF_VAR_project: ${{ secrets.S3_PROJECT_NAME }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_environment: ${{ secrets.ENVIRONMENT }}
          TF_VAR_website_prefix: ${{ secrets.S3_WEBSITE_PREFIX }}

  # ─────────────────────────────────────────────────────────────────────────────
  # POST-DESTROY CLEANUP — removes bootstrap resources Terraform does NOT manage
  # ─────────────────────────────────────────────────────────────────────────────
  post-destroy-cleanup:
    name: Post-Destroy Cleanup — State Bucket & DynamoDB Lock Table
    runs-on: ubuntu-latest
    needs: terraform-destroy

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Drain and delete S3 state bucket ─────────────────────────────────────

      - name: State bucket — suspend versioning
        run: |
          aws s3api put-bucket-versioning \
            --bucket "${{ secrets.TF_STATE_BUCKET }}" \
            --versioning-configuration Status=Suspended \
            --region "${{ secrets.AWS_REGION }}" || true

      - name: State bucket — delete all object versions
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          REGION="${{ secrets.AWS_REGION }}"
          while true; do
            VERSIONS=$(aws s3api list-object-versions \
              --bucket "${BUCKET}" --region "${REGION}" \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)
            COUNT=$(echo "${VERSIONS}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))")
            [ "${COUNT}" -eq 0 ] && { echo "No more versions."; break; }
            echo "Deleting batch of ${COUNT} versions ..."
            aws s3api delete-objects \
              --bucket "${BUCKET}" --region "${REGION}" \
              --delete "${VERSIONS}" > /dev/null
          done

      - name: State bucket — delete all delete markers
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          REGION="${{ secrets.AWS_REGION }}"
          while true; do
            MARKERS=$(aws s3api list-object-versions \
              --bucket "${BUCKET}" --region "${REGION}" \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)
            COUNT=$(echo "${MARKERS}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))")
            [ "${COUNT}" -eq 0 ] && { echo "No more delete markers."; break; }
            echo "Deleting batch of ${COUNT} delete markers ..."
            aws s3api delete-objects \
              --bucket "${BUCKET}" --region "${REGION}" \
              --delete "${MARKERS}" > /dev/null
          done

      - name: State bucket — delete the bucket
        run: |
          aws s3api delete-bucket \
            --bucket "${{ secrets.TF_STATE_BUCKET }}" \
            --region "${{ secrets.AWS_REGION }}"
          echo "State bucket s3://${{ secrets.TF_STATE_BUCKET }} deleted."

      # ── Delete DynamoDB lock table ────────────────────────────────────────────

      - name: DynamoDB — delete the Terraform lock table
        run: |
          TABLE="${{ secrets.TF_LOCK_TABLE }}"
          REGION="${{ secrets.AWS_REGION }}"
          aws dynamodb delete-table \
            --table-name "${TABLE}" --region "${REGION}"
          aws dynamodb wait table-not-exists \
            --table-name "${TABLE}" --region "${REGION}"
          echo "DynamoDB table '${TABLE}' deleted."

  # ─────────────────────────────────────────────────────────────────────────────
  # SUMMARY — runs unconditionally so you always see what happened
  # ─────────────────────────────────────────────────────────────────────────────
  teardown-summary:
    name: Teardown Summary
    runs-on: ubuntu-latest
    needs: [safety-gate, approval-gate, terraform-destroy, post-destroy-cleanup]
    if: always()

    steps:
      - name: Print teardown summary
        run: |
          echo "============================================================"
          echo "  S3 WEBSITE — FULL TEARDOWN SUMMARY"
          echo "============================================================"
          echo ""
          echo "  Triggered by : ${{ github.actor }}"
          echo "  Run ID       : ${{ github.run_id }}"
          echo "  Timestamp    : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "  Repository   : ${{ github.repository }}"
          echo ""
          echo "  Job results:"
          echo "    safety-gate          : ${{ needs.safety-gate.result }}"
          echo "    approval-gate        : ${{ needs.approval-gate.result }}"
          echo "    terraform-destroy    : ${{ needs.terraform-destroy.result }}"
          echo "    post-destroy-cleanup : ${{ needs.post-destroy-cleanup.result }}"
          echo ""
          echo "  Resources destroyed by Terraform:"
          echo "    S3 website bucket     (versioning suspended + drained before destroy)"
          echo "    S3 access logs bucket (versioning suspended + drained before destroy)"
          echo "    CloudFront distribution (disabled before destroy)"
          echo "    CloudFront Origin Access Control (OAC)"
          echo "    S3 bucket policy (OAC access grant)"
          echo ""
          echo "  Resources removed post-destroy:"
          echo "    S3 state bucket  : s3://${{ secrets.TF_STATE_BUCKET }}"
          echo "    DynamoDB table   : ${{ secrets.TF_LOCK_TABLE }}"
          echo "============================================================"
