name: EKS Prod — Security Scan & Deploy

on:
  push:
    branches: [main]
    paths:
      - "eks-prod/**"
  pull_request:
    branches: [main]
    paths:
      - "eks-prod/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

env:
  TF_VERSION: "1.9.0"
  TF_WORKING_DIR: eks-prod/terraform
  AWS_REGION: ${{ secrets.AWS_REGION }}

permissions:
  contents: read
  security-events: write   # upload SARIF results to GitHub Security tab
  id-token: write          # required for GitHub OIDC token (role-to-assume)

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. SECURITY SCANS — all must pass before any Terraform runs
  # ─────────────────────────────────────────────────────────────────────────────

  tfsec:
    name: tfsec (IaC static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tfsec
        run: |
          curl -sLo /usr/local/bin/tfsec \
            https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64
          chmod +x /usr/local/bin/tfsec

      - name: Run tfsec
        run: |
          tfsec ${{ env.TF_WORKING_DIR }} \
            --minimum-severity MEDIUM \
            --config-file eks-prod/.tfsec.yml \
            --format sarif \
            --out tfsec.sarif

      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: tfsec.sarif

  checkov:
    name: checkov (policy as code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
          quiet: true
          # Skip checks that are intentional decisions (document each skip)
          skip_check: >
            CKV_AWS_144,
            CKV2_AWS_38,
            CKV2_AWS_39

      - name: Upload checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov.sarif

  trivy:
    name: trivy (vulnerability + IaC scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run trivy IaC scan
        run: |
          trivy config ${{ env.TF_WORKING_DIR }} \
            --severity MEDIUM,HIGH,CRITICAL \
            --ignorefile ${{ env.TF_WORKING_DIR }}/.trivyignore \
            --format sarif \
            --output trivy.sarif \
            --exit-code 1

      - name: Upload trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif

  tflint:
    name: tflint (Terraform linting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init tflint plugins
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --init --config ../../eks-prod/.tflint.hcl

      - name: Run tflint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --config ../../eks-prod/.tflint.hcl --format compact

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. TERRAFORM VALIDATE & PLAN
  # ─────────────────────────────────────────────────────────────────────────────

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [tfsec, checkov, trivy, tflint]  # all scans must pass

    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exit_code }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: eks-prod-tf-plan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -input=false

      - name: Terraform Format check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -out=tfplan \
            -detailed-exitcode \
            -input=false
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        env:
          TF_VAR_cluster_name: ${{ secrets.EKS_CLUSTER_NAME }}
        continue-on-error: true  # exit code 2 = changes present (not an error)

      - name: Fail on plan error
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. TERRAFORM APPLY — requires manual approval via "production" environment
  # ─────────────────────────────────────────────────────────────────────────────

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    # Only run on merges to main or explicit workflow_dispatch apply
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')

    # "production" environment requires approval from a designated reviewer
    # Configure this under repo Settings → Environments → production
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: eks-prod-tf-apply

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan

      - name: Post apply — print kubeconfig command
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output kubeconfig_command

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. DESTROY — only via explicit workflow_dispatch
  # ─────────────────────────────────────────────────────────────────────────────

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment: production  # requires approval

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: eks-prod-tf-destroy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -input=false

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -var-file=terraform.tfvars -auto-approve -input=false
