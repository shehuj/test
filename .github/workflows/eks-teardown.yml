name: EKS Prod — Full Teardown (DESTRUCTIVE)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly 'yes-delete-all' to confirm full teardown of the EKS production cluster and all associated resources. THIS IS IRREVERSIBLE."
        required: true
        type: string
      delete_oidc_provider:
        description: "Also delete the ACCOUNT-WIDE GitHub OIDC provider. WARNING: this breaks OIDC auth for EVERY repo/workflow in this AWS account (including eks-deploy). Only enable when decommissioning the whole account."
        required: false
        type: boolean
        default: false

env:
  TF_VERSION: "1.9.0"
  TF_WORKING_DIR: eks-prod/terraform
  AWS_REGION: ${{ secrets.AWS_REGION }}

permissions:
  contents: read
  id-token: write  # required for GitHub OIDC token (role-to-assume)

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # SAFETY GATE — abort immediately if confirmation string is wrong
  # ─────────────────────────────────────────────────────────────────────────────
  safety-gate:
    name: Safety Gate — Validate Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "yes-delete-all" ]; then
            echo "::error::Confirmation input does not match required value 'yes-delete-all'."
            echo "::error::Got: '${{ github.event.inputs.confirmation }}'"
            echo "::error::Aborting teardown to prevent accidental destruction."
            exit 1
          fi
          echo "Confirmation accepted. Proceeding to approval gate."

  # ─────────────────────────────────────────────────────────────────────────────
  # APPROVAL GATE — requires manual approval via the "production" environment
  # Configure required reviewers under repo Settings → Environments → production
  # ─────────────────────────────────────────────────────────────────────────────
  approval-gate:
    name: Approval Gate — Await Manual Sign-Off
    runs-on: ubuntu-latest
    needs: safety-gate
    environment: production
    steps:
      - name: Approval received
        run: |
          echo "Manual approval granted by a production environment reviewer."
          echo "Triggered by : ${{ github.actor }}"
          echo "Run ID       : ${{ github.run_id }}"
          echo "Timestamp    : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

  # ─────────────────────────────────────────────────────────────────────────────
  # TERRAFORM DESTROY — tears down all resources managed by Terraform
  # Order: addons → node_groups → eks → irsa → iam → security_groups → vpc → kms
  # ─────────────────────────────────────────────────────────────────────────────
  terraform-destroy:
    name: Terraform Destroy — EKS Cluster & All Managed Resources
    runs-on: ubuntu-latest
    needs: approval-gate

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: eks-prod-teardown-tf-destroy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ── Pre-destroy: remove Kubernetes-provisioned AWS resources ─────────────
      # Services of type LoadBalancer and the AWS Load Balancer Controller create
      # ELBs/ALBs/NLBs, target groups, security groups, and ENIs OUTSIDE Terraform
      # state. These hold references to the VPC/subnets and make `terraform destroy`
      # fail. The cluster API endpoint is private, so kubectl can't reach it from
      # the runner — we clean these orphaned resources directly via the AWS API.
      - name: Clean up orphaned load balancers and ENIs
        env:
          CLUSTER: ${{ secrets.EKS_CLUSTER_NAME }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          VPC_ID=$(aws ec2 describe-vpcs --region "${REGION}" \
            --filters "Name=tag:kubernetes.io/cluster/${CLUSTER},Values=shared,owned" \
            --query 'Vpcs[0].VpcId' --output text 2>/dev/null || true)

          if [ -z "${VPC_ID}" ] || [ "${VPC_ID}" = "None" ]; then
            echo "No VPC found for cluster '${CLUSTER}' — nothing to clean up."
            exit 0
          fi
          echo "Cluster VPC: ${VPC_ID}"

          # 1. Delete ALBs / NLBs (elbv2) in the VPC
          for ARN in $(aws elbv2 describe-load-balancers --region "${REGION}" \
              --query "LoadBalancers[?VpcId=='${VPC_ID}'].LoadBalancerArn" \
              --output text 2>/dev/null || true); do
            echo "Deleting load balancer ${ARN}"
            aws elbv2 delete-load-balancer --region "${REGION}" --load-balancer-arn "${ARN}" || true
          done

          # 2. Delete classic ELBs in the VPC
          for NAME in $(aws elb describe-load-balancers --region "${REGION}" \
              --query "LoadBalancerDescriptions[?VPCId=='${VPC_ID}'].LoadBalancerName" \
              --output text 2>/dev/null || true); do
            echo "Deleting classic ELB ${NAME}"
            aws elb delete-load-balancer --region "${REGION}" --load-balancer-name "${NAME}" || true
          done

          # 3. Wait for load balancers to fully detach (they hold ENIs)
          echo "Waiting for load balancers to drain from the VPC ..."
          for i in $(seq 1 30); do
            REMAINING=$(aws elbv2 describe-load-balancers --region "${REGION}" \
              --query "length(LoadBalancers[?VpcId=='${VPC_ID}'])" --output text 2>/dev/null || echo 0)
            [ "${REMAINING}" = "0" ] && { echo "All elbv2 load balancers gone."; break; }
            echo "  ${REMAINING} load balancer(s) still present — waiting ..."
            sleep 10
          done

          # 4. Delete leftover target groups in the VPC
          for TG in $(aws elbv2 describe-target-groups --region "${REGION}" \
              --query "TargetGroups[?VpcId=='${VPC_ID}'].TargetGroupArn" \
              --output text 2>/dev/null || true); do
            echo "Deleting target group ${TG}"
            aws elbv2 delete-target-group --region "${REGION}" --target-group-arn "${TG}" || true
          done

          # 5. Delete security groups created by the LB controller (tagged)
          for SG in $(aws ec2 describe-security-groups --region "${REGION}" \
              --filters "Name=vpc-id,Values=${VPC_ID}" "Name=tag-key,Values=elbv2.k8s.aws/cluster" \
              --query 'SecurityGroups[].GroupId' --output text 2>/dev/null || true); do
            echo "Deleting LB-controller security group ${SG}"
            aws ec2 delete-security-group --region "${REGION}" --group-id "${SG}" || true
          done

          # 6. Delete any leftover detached (available) ENIs in the VPC
          for ENI in $(aws ec2 describe-network-interfaces --region "${REGION}" \
              --filters "Name=vpc-id,Values=${VPC_ID}" "Name=status,Values=available" \
              --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null || true); do
            echo "Deleting detached ENI ${ENI}"
            aws ec2 delete-network-interface --region "${REGION}" --network-interface-id "${ENI}" || true
          done

          echo "Orphaned resource cleanup complete."

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_cluster_name: ${{ secrets.EKS_CLUSTER_NAME }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
        run: |
          # Retry destroy — VPC/subnet/SG deletion can fail on the first pass
          # while ENIs from just-deleted load balancers finish detaching
          # (DependencyViolation). Each retry waits for AWS to settle.
          for attempt in 1 2 3; do
            echo "=== Terraform destroy attempt ${attempt}/3 ==="
            if terraform destroy -auto-approve -input=false; then
              echo "Destroy succeeded on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Attempt ${attempt} failed — waiting 60s for AWS resources to settle ..."
              sleep 60
            fi
          done
          echo "::error::terraform destroy failed after 3 attempts."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # POST-DESTROY CLEANUP — removes bootstrap resources Terraform does NOT manage:
  #   - S3 state bucket   (drain all versions + delete markers, then delete bucket)
  #   - DynamoDB lock table
  #   - GitHub Actions OIDC provider from AWS IAM
  # ─────────────────────────────────────────────────────────────────────────────
  post-destroy-cleanup:
    name: Post-Destroy Cleanup — S3, DynamoDB, OIDC Provider
    runs-on: ubuntu-latest
    needs: terraform-destroy

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: eks-prod-teardown-post-cleanup

      # ── S3 State Bucket ──────────────────────────────────────────────────────

      - name: S3 — Suspend versioning (stop new versions during drain)
        run: |
          aws s3api put-bucket-versioning \
            --bucket "${{ secrets.TF_STATE_BUCKET }}" \
            --versioning-configuration Status=Suspended \
            --region "${{ secrets.AWS_REGION }}" || true

      - name: S3 — Delete all object versions
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          REGION="${{ secrets.AWS_REGION }}"

          while true; do
            VERSIONS=$(aws s3api list-object-versions \
              --bucket "${BUCKET}" --region "${REGION}" \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)

            COUNT=$(echo "${VERSIONS}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))")

            [ "${COUNT}" -eq 0 ] && { echo "No more versions."; break; }

            echo "Deleting batch of ${COUNT} versions ..."
            aws s3api delete-objects \
              --bucket "${BUCKET}" --region "${REGION}" \
              --delete "${VERSIONS}" > /dev/null
          done

      - name: S3 — Delete all delete markers
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          REGION="${{ secrets.AWS_REGION }}"

          while true; do
            MARKERS=$(aws s3api list-object-versions \
              --bucket "${BUCKET}" --region "${REGION}" \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)

            COUNT=$(echo "${MARKERS}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))")

            [ "${COUNT}" -eq 0 ] && { echo "No more delete markers."; break; }

            echo "Deleting batch of ${COUNT} delete markers ..."
            aws s3api delete-objects \
              --bucket "${BUCKET}" --region "${REGION}" \
              --delete "${MARKERS}" > /dev/null
          done

      - name: S3 — Delete the state bucket
        run: |
          aws s3api delete-bucket \
            --bucket "${{ secrets.TF_STATE_BUCKET }}" \
            --region "${{ secrets.AWS_REGION }}"
          echo "Bucket s3://${{ secrets.TF_STATE_BUCKET }} deleted."

      # ── DynamoDB Lock Table ──────────────────────────────────────────────────

      - name: DynamoDB — Delete the Terraform lock table
        run: |
          TABLE="${{ secrets.TF_LOCK_TABLE }}"
          REGION="${{ secrets.AWS_REGION }}"

          aws dynamodb delete-table \
            --table-name "${TABLE}" --region "${REGION}"

          aws dynamodb wait table-not-exists \
            --table-name "${TABLE}" --region "${REGION}"

          echo "DynamoDB table '${TABLE}' deleted."

      # ── GitHub Actions OIDC Provider ─────────────────────────────────────────

      - name: IAM — Find the GitHub Actions OIDC provider ARN
        id: find-oidc
        if: ${{ github.event.inputs.delete_oidc_provider == 'true' }}
        run: |
          # The GitHub OIDC provider ARN is deterministic:
          #   arn:<partition>:iam::<account>:oidc-provider/token.actions.githubusercontent.com
          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)
          PARTITION=$(echo "${CALLER_ARN}" | cut -d: -f2)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          OIDC_ARN="arn:${PARTITION}:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"

          # Only flag it for deletion if it actually exists.
          if aws iam get-open-id-connect-provider --open-id-connect-provider-arn "${OIDC_ARN}" >/dev/null 2>&1; then
            echo "Found: ${OIDC_ARN}"
            echo "oidc_arn=${OIDC_ARN}" >> "$GITHUB_OUTPUT"
          else
            echo "No GitHub OIDC provider found — already removed or never created."
            echo "oidc_arn=" >> "$GITHUB_OUTPUT"
          fi

      - name: IAM — Delete the GitHub Actions OIDC provider
        if: ${{ github.event.inputs.delete_oidc_provider == 'true' && steps.find-oidc.outputs.oidc_arn != '' }}
        run: |
          aws iam delete-open-id-connect-provider \
            --open-id-connect-provider-arn "${{ steps.find-oidc.outputs.oidc_arn }}"
          echo "OIDC provider deleted."

  # ─────────────────────────────────────────────────────────────────────────────
  # SUMMARY — runs even if a cleanup step failed, so you always see what happened
  # ─────────────────────────────────────────────────────────────────────────────
  teardown-summary:
    name: Teardown Summary
    runs-on: ubuntu-latest
    needs: [safety-gate, approval-gate, terraform-destroy, post-destroy-cleanup]
    if: always()

    steps:
      - name: Print teardown summary
        run: |
          echo "============================================================"
          echo "  EKS PRODUCTION CLUSTER — FULL TEARDOWN SUMMARY"
          echo "============================================================"
          echo ""
          echo "  Triggered by : ${{ github.actor }}"
          echo "  Run ID       : ${{ github.run_id }}"
          echo "  Timestamp    : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "  Repository   : ${{ github.repository }}"
          echo ""
          echo "  Job results:"
          echo "    safety-gate          : ${{ needs.safety-gate.result }}"
          echo "    approval-gate        : ${{ needs.approval-gate.result }}"
          echo "    terraform-destroy    : ${{ needs.terraform-destroy.result }}"
          echo "    post-destroy-cleanup : ${{ needs.post-destroy-cleanup.result }}"
          echo ""
          echo "  Resources destroyed by Terraform:"
          echo "    EKS cluster + node groups + managed addons"
          echo "    IAM roles and policies (cluster, nodes, IRSA)"
          echo "    VPC, subnets, NAT gateways, internet gateway, EIPs"
          echo "    Security groups"
          echo "    KMS keys and aliases (eks-secrets, ebs, cloudwatch)"
          echo "    CloudWatch log groups (control-plane + VPC flow logs)"
          echo "    Launch templates"
          echo ""
          echo "  Resources removed post-destroy:"
          echo "    S3 state bucket  : s3://${{ secrets.TF_STATE_BUCKET }}"
          echo "    DynamoDB table   : ${{ secrets.TF_LOCK_TABLE }}"
          echo "    IAM OIDC provider: ${{ github.event.inputs.delete_oidc_provider == 'true' && 'DELETED (token.actions.githubusercontent.com)' || 'kept (delete_oidc_provider was false)' }}"
          echo "============================================================"
