name: EKS Prod — Full Teardown (DESTRUCTIVE)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly 'yes-delete-all' to confirm full teardown of the EKS production cluster and all associated resources. THIS IS IRREVERSIBLE."
        required: true
        type: string

env:
  TF_VERSION: "1.9.0"
  TF_WORKING_DIR: eks-prod/terraform
  AWS_REGION: ${{ secrets.AWS_REGION }}

permissions:
  contents: read
  id-token: write  # required for GitHub OIDC token (role-to-assume)

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # SAFETY GATE — abort immediately if confirmation string is wrong
  # ─────────────────────────────────────────────────────────────────────────────
  safety-gate:
    name: Safety Gate — Validate Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "yes-delete-all" ]; then
            echo "::error::Confirmation input does not match required value 'yes-delete-all'."
            echo "::error::Got: '${{ github.event.inputs.confirmation }}'"
            echo "::error::Aborting teardown to prevent accidental destruction."
            exit 1
          fi
          echo "Confirmation accepted. Proceeding to approval gate."

  # ─────────────────────────────────────────────────────────────────────────────
  # APPROVAL GATE — requires manual approval via the "production" environment
  # Configure required reviewers under repo Settings → Environments → production
  # ─────────────────────────────────────────────────────────────────────────────
  approval-gate:
    name: Approval Gate — Await Manual Sign-Off
    runs-on: ubuntu-latest
    needs: safety-gate
    environment: production
    steps:
      - name: Approval received
        run: |
          echo "Manual approval granted by a production environment reviewer."
          echo "Triggered by : ${{ github.actor }}"
          echo "Run ID       : ${{ github.run_id }}"
          echo "Timestamp    : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

  # ─────────────────────────────────────────────────────────────────────────────
  # TERRAFORM DESTROY — tears down all resources managed by Terraform
  # Order: addons → node_groups → eks → irsa → iam → security_groups → vpc → kms
  # ─────────────────────────────────────────────────────────────────────────────
  terraform-destroy:
    name: Terraform Destroy — EKS Cluster & All Managed Resources
    runs-on: ubuntu-latest
    needs: approval-gate

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: eks-prod-teardown-tf-destroy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve -input=false
        env:
          TF_VAR_cluster_name: ${{ secrets.EKS_CLUSTER_NAME }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

  # ─────────────────────────────────────────────────────────────────────────────
  # POST-DESTROY CLEANUP — removes bootstrap resources Terraform does NOT manage:
  #   - S3 state bucket   (drain all versions + delete markers, then delete bucket)
  #   - DynamoDB lock table
  #   - GitHub Actions OIDC provider from AWS IAM
  # ─────────────────────────────────────────────────────────────────────────────
  post-destroy-cleanup:
    name: Post-Destroy Cleanup — S3, DynamoDB, OIDC Provider
    runs-on: ubuntu-latest
    needs: terraform-destroy

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: eks-prod-teardown-post-cleanup

      # ── S3 State Bucket ──────────────────────────────────────────────────────

      - name: S3 — Suspend versioning (stop new versions during drain)
        run: |
          aws s3api put-bucket-versioning \
            --bucket "${{ secrets.TF_STATE_BUCKET }}" \
            --versioning-configuration Status=Suspended \
            --region "${{ secrets.AWS_REGION }}" || true

      - name: S3 — Delete all object versions
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          REGION="${{ secrets.AWS_REGION }}"

          while true; do
            VERSIONS=$(aws s3api list-object-versions \
              --bucket "${BUCKET}" --region "${REGION}" \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)

            COUNT=$(echo "${VERSIONS}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))")

            [ "${COUNT}" -eq 0 ] && { echo "No more versions."; break; }

            echo "Deleting batch of ${COUNT} versions ..."
            aws s3api delete-objects \
              --bucket "${BUCKET}" --region "${REGION}" \
              --delete "${VERSIONS}" > /dev/null
          done

      - name: S3 — Delete all delete markers
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          REGION="${{ secrets.AWS_REGION }}"

          while true; do
            MARKERS=$(aws s3api list-object-versions \
              --bucket "${BUCKET}" --region "${REGION}" \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null)

            COUNT=$(echo "${MARKERS}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(len(d.get('Objects') or []))")

            [ "${COUNT}" -eq 0 ] && { echo "No more delete markers."; break; }

            echo "Deleting batch of ${COUNT} delete markers ..."
            aws s3api delete-objects \
              --bucket "${BUCKET}" --region "${REGION}" \
              --delete "${MARKERS}" > /dev/null
          done

      - name: S3 — Delete the state bucket
        run: |
          aws s3api delete-bucket \
            --bucket "${{ secrets.TF_STATE_BUCKET }}" \
            --region "${{ secrets.AWS_REGION }}"
          echo "Bucket s3://${{ secrets.TF_STATE_BUCKET }} deleted."

      # ── DynamoDB Lock Table ──────────────────────────────────────────────────

      - name: DynamoDB — Delete the Terraform lock table
        run: |
          TABLE="${{ secrets.TF_LOCK_TABLE }}"
          REGION="${{ secrets.AWS_REGION }}"

          aws dynamodb delete-table \
            --table-name "${TABLE}" --region "${REGION}"

          aws dynamodb wait table-not-exists \
            --table-name "${TABLE}" --region "${REGION}"

          echo "DynamoDB table '${TABLE}' deleted."

      # ── GitHub Actions OIDC Provider ─────────────────────────────────────────

      - name: IAM — Find the GitHub Actions OIDC provider ARN
        id: find-oidc
        run: |
          OIDC_ARN=$(aws iam list-open-id-connect-providers \
            --query "OpenIDConnectProviderList[?ends_with(Arn,'token.actions.githubusercontent.com')].Arn" \
            --output text 2>/dev/null || true)

          # Fallback: inspect each provider's URL
          if [ -z "${OIDC_ARN}" ] || [ "${OIDC_ARN}" = "None" ]; then
            OIDC_ARN=$(aws iam list-open-id-connect-providers --output json | \
              python3 -c "
import sys, json, subprocess
for p in json.load(sys.stdin).get('OpenIDConnectProviderList', []):
    arn = p['Arn']
    out = subprocess.run(['aws','iam','get-open-id-connect-provider',
                          '--open-id-connect-provider-arn', arn],
                         capture_output=True, text=True).stdout
    if 'token.actions.githubusercontent.com' in json.loads(out).get('Url',''):
        print(arn); break
" 2>/dev/null || true)
          fi

          if [ -z "${OIDC_ARN}" ] || [ "${OIDC_ARN}" = "None" ]; then
            echo "No GitHub OIDC provider found — already removed or never created."
            echo "oidc_arn=" >> "$GITHUB_OUTPUT"
          else
            echo "Found: ${OIDC_ARN}"
            echo "oidc_arn=${OIDC_ARN}" >> "$GITHUB_OUTPUT"
          fi

      - name: IAM — Delete the GitHub Actions OIDC provider
        if: steps.find-oidc.outputs.oidc_arn != ''
        run: |
          aws iam delete-open-id-connect-provider \
            --open-id-connect-provider-arn "${{ steps.find-oidc.outputs.oidc_arn }}"
          echo "OIDC provider deleted."

  # ─────────────────────────────────────────────────────────────────────────────
  # SUMMARY — runs even if a cleanup step failed, so you always see what happened
  # ─────────────────────────────────────────────────────────────────────────────
  teardown-summary:
    name: Teardown Summary
    runs-on: ubuntu-latest
    needs: [safety-gate, approval-gate, terraform-destroy, post-destroy-cleanup]
    if: always()

    steps:
      - name: Print teardown summary
        run: |
          echo "============================================================"
          echo "  EKS PRODUCTION CLUSTER — FULL TEARDOWN SUMMARY"
          echo "============================================================"
          echo ""
          echo "  Triggered by : ${{ github.actor }}"
          echo "  Run ID       : ${{ github.run_id }}"
          echo "  Timestamp    : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "  Repository   : ${{ github.repository }}"
          echo ""
          echo "  Job results:"
          echo "    safety-gate          : ${{ needs.safety-gate.result }}"
          echo "    approval-gate        : ${{ needs.approval-gate.result }}"
          echo "    terraform-destroy    : ${{ needs.terraform-destroy.result }}"
          echo "    post-destroy-cleanup : ${{ needs.post-destroy-cleanup.result }}"
          echo ""
          echo "  Resources destroyed by Terraform:"
          echo "    EKS cluster + node groups + managed addons"
          echo "    IAM roles and policies (cluster, nodes, IRSA)"
          echo "    VPC, subnets, NAT gateways, internet gateway, EIPs"
          echo "    Security groups"
          echo "    KMS keys and aliases (eks-secrets, ebs, cloudwatch)"
          echo "    CloudWatch log groups (control-plane + VPC flow logs)"
          echo "    Launch templates"
          echo ""
          echo "  Resources removed post-destroy:"
          echo "    S3 state bucket  : s3://${{ secrets.TF_STATE_BUCKET }}"
          echo "    DynamoDB table   : ${{ secrets.TF_LOCK_TABLE }}"
          echo "    IAM OIDC provider: token.actions.githubusercontent.com"
          echo "============================================================"
