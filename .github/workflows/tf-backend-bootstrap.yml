name: TF Backend Bootstrap (AWS CLI)

# Creates the S3 state bucket + DynamoDB lock table used as the Terraform
# remote backend. Run once manually. Idempotent — safe to re-run.

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "S3 state bucket name"
        required: true
        default: "bathbucket35"
        type: string
      table_name:
        description: "DynamoDB lock table name"
        required: true
        default: "dyning-table"
        type: string

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

permissions:
  contents: read

jobs:
  bootstrap-backend:
    name: Create S3 bucket & DynamoDB table
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── S3 state bucket ──────────────────────────────────────────────────────

      - name: Create S3 bucket
        env:
          BUCKET: ${{ github.event.inputs.bucket_name }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            echo "Bucket s3://${BUCKET} already exists — skipping creation."
          else
            echo "Creating bucket s3://${BUCKET} in ${REGION} ..."
            if [ "${REGION}" = "us-east-1" ]; then
              # us-east-1 must NOT pass a LocationConstraint
              aws s3api create-bucket --bucket "${BUCKET}" --region "${REGION}"
            else
              aws s3api create-bucket --bucket "${BUCKET}" --region "${REGION}" \
                --create-bucket-configuration "LocationConstraint=${REGION}"
            fi
            echo "Bucket created."
          fi

      - name: Enable bucket versioning
        env:
          BUCKET: ${{ github.event.inputs.bucket_name }}
        run: |
          set -euo pipefail
          aws s3api put-bucket-versioning \
            --bucket "${BUCKET}" \
            --versioning-configuration Status=Enabled
          echo "Versioning enabled."

      - name: Enable default encryption (AES256)
        env:
          BUCKET: ${{ github.event.inputs.bucket_name }}
        run: |
          set -euo pipefail
          aws s3api put-bucket-encryption \
            --bucket "${BUCKET}" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
          echo "Encryption enabled."

      - name: Block all public access
        env:
          BUCKET: ${{ github.event.inputs.bucket_name }}
        run: |
          set -euo pipefail
          aws s3api put-public-access-block \
            --bucket "${BUCKET}" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          echo "Public access blocked."

      # ── DynamoDB lock table ──────────────────────────────────────────────────

      - name: Create DynamoDB lock table
        env:
          TABLE: ${{ github.event.inputs.table_name }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          if aws dynamodb describe-table --table-name "${TABLE}" --region "${REGION}" >/dev/null 2>&1; then
            echo "DynamoDB table '${TABLE}' already exists — skipping creation."
          else
            echo "Creating DynamoDB table '${TABLE}' ..."
            aws dynamodb create-table \
              --table-name "${TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${REGION}"

            echo "Waiting for table to become ACTIVE ..."
            aws dynamodb wait table-exists --table-name "${TABLE}" --region "${REGION}"
            echo "Table is ACTIVE."
          fi

      # ── Summary ──────────────────────────────────────────────────────────────

      - name: Summary
        env:
          BUCKET: ${{ github.event.inputs.bucket_name }}
          TABLE: ${{ github.event.inputs.table_name }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "============================================================"
          echo "  TERRAFORM BACKEND BOOTSTRAP COMPLETE"
          echo "============================================================"
          echo "  S3 bucket      : ${BUCKET}"
          echo "  DynamoDB table : ${TABLE}"
          echo "  Region         : ${REGION}"
          echo ""
          echo "  Use in a backend block:"
          echo "    backend \"s3\" {"
          echo "      bucket         = \"${BUCKET}\""
          echo "      key            = \"<project>/terraform.tfstate\""
          echo "      region         = \"${REGION}\""
          echo "      dynamodb_table = \"${TABLE}\""
          echo "      encrypt        = true"
          echo "    }"
          echo "============================================================"
